[project]
name = "lovely-interiors"
version = "0.1.0"
description = "Color Flow Paint Agent (MVP)"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.7.0",
    "google-generativeai>=0.8.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "lxml>=4.9.3",
    "requests-oauthlib>=1.3.1",
    "pillow>=10.0.0",
    "urllib3>=2.0.0"
]

[tool.setuptools]
packages = ["color_flow_paint_agent"]
